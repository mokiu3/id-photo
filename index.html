<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>证件照小工具</title>
<style>
:root{--surface:#fff;--surface2:#f0f4fa;--border:#e6ebf2;--text:#2c3340;--muted:#8b95a8;--primary:#5b8def;--accent:#5ec4b0;--accent-soft:#e6f7f3;--warn-soft:#fff4e8;--warn:#d4892a;--danger-soft:#ffecec;--danger:#d45b5b;--radius:18px;--shadow:0 8px 24px rgba(91,141,239,.08);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:linear-gradient(180deg,#eef5ff 0%,#f7f9fc 45%,#fff6f9 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:14px 14px calc(14px + var(--safe-b))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{font-size:18px;font-weight:700;color:#3d4a63}
header .badge{font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid #c8ebe3;padding:5px 10px;border-radius:999px;font-weight:600}
header .badge.bad{color:var(--danger);background:var(--danger-soft);border-color:#f5c8c8}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);background:var(--surface2)}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,#6a9af5,#5b8def);color:#fff}
.btn-accent{background:var(--accent-soft);color:#2f9e8c;border:1px solid #c8ebe3}
.btn-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f5d7b0}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #f5c8c8}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--muted)}
.btn-pink{background:#fff0f6;color:#d66b95;border:1px solid #f5c9db}
.btn.active{outline:2px solid var(--primary);outline-offset:1px}
.btn-block{width:100%;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px}.row>.btn,.row>select{flex:1;min-width:0}
select,input[type=range]{height:44px;border-radius:14px;border:1px solid var(--border);background:#fff;color:var(--text);padding:0 12px;font-size:14px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;padding:0;background:#e8eef8;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 2px 6px rgba(91,141,239,.35)}
#canvas-wrap{width:100%;background:#f5f8fc;border-radius:16px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:220px;border:1px solid var(--border);position:relative;touch-action:pan-y}
#canvas-wrap.editable{touch-action:none;box-shadow:inset 0 0 0 2px rgba(91,141,239,.35)}
#canvas-wrap canvas{display:block;max-width:100%;max-height:70vh;background:#fff}
/* 画笔焦点环 */
#brushCursor{position:absolute;border-radius:50%;pointer-events:none;display:none;z-index:5;
  box-shadow:0 0 0 2px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.95);}
#brushCursor::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.canvas-lock{position:absolute;right:10px;bottom:10px;font-size:11px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--muted);border:1px solid var(--border);pointer-events:none;z-index:2}
.meta{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.tip{margin-top:8px;padding:8px 10px;border-radius:12px;background:#f3f7ff;border:1px solid #d9e6ff;color:#5a6f96;font-size:12px;line-height:1.45}
#status{display:none;text-align:center;padding:10px 12px;border-radius:14px;font-size:13px;margin-bottom:10px;word-break:break-all}
.loading{display:block;background:var(--warn-soft);color:var(--warn);border:1px solid #f5d7b0}
.success{display:block;background:var(--accent-soft);color:#2f9e8c;border:1px solid #c8ebe3}
.error{display:block;background:var(--danger-soft);color:var(--danger);border:1px solid #f5c8c8}
.progress-wrap{display:none;margin-bottom:10px}
.progress-bar{height:8px;border-radius:999px;background:#e8eef8;overflow:hidden}
.progress-inner{height:100%;width:0%;background:linear-gradient(90deg,#6a9af5,#5ec4b0);transition:width .2s}
.progress-text{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.slider-row label{font-size:13px;color:var(--muted);white-space:nowrap}
.slider-row span{font-size:13px;width:32px;text-align:right}
.bottom{margin-top:auto;padding-top:6px}
#refinePanel{display:none}#refinePanel.show{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ad-slot{display:none;min-height:56px;margin-bottom:10px;border-radius:14px;background:#f5f8fc;border:1px dashed #d0d8e8;overflow:hidden;text-align:center}
.ad-slot.on{display:block}
.ad-slot .ad-placeholder{padding:12px;font-size:12px;color:#9aa8bf;line-height:1.4}
#donatePanel{display:none;margin-top:10px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#fff8f0,#f3f8ff);border:1px solid #f0e0d0;text-align:center}
#donatePanel.show{display:block}
#donatePanel .donate-title{font-size:14px;font-weight:700;color:#3d4a63;margin-bottom:6px}
#donatePanel .donate-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px}
#donatePanel .qr-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
#donatePanel .qr-item{width:120px}
#donatePanel .qr-item img{width:120px;height:120px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--border)}
#donatePanel .qr-item .qr-label{font-size:11px;color:var(--muted);margin-top:4px}
#donatePanel .donate-close{margin-top:10px;font-size:12px;color:var(--primary);background:none;border:none;cursor:pointer;text-decoration:underline}

/* ===== 背景色色块（7 个常用色，选中呼吸放大，无外框） ===== */
.swatches{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px;padding:4px 2px 6px}
.swatch{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;position:relative;flex:0 0 auto;
  box-shadow:0 2px 8px rgba(44,51,64,.14);transition:transform .18s ease}
.swatch::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(0,0,0,.06)}
.swatch.active{animation:breathe 1.9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1.04)}50%{transform:scale(1.22)}}
/* ===== RGB 调色 ===== */
.color-panel{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px}
.rgb-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.rgb-row label{width:14px;font-size:12px;color:var(--muted);font-weight:700}
.rgb-row input[type=range]{flex:1}
.rgb-row .val{width:34px;text-align:right;font-size:12px;color:var(--muted)}
.color-tools{display:flex;align-items:center;gap:8px;margin-top:8px}
.color-tools .hex{flex:1;height:38px;line-height:38px;text-align:center;border-radius:12px;background:var(--surface2);font-size:13px;letter-spacing:.5px;color:#55617a}
.color-tools .btn{min-height:38px;border-radius:12px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>证件照小工具</h1>
  <span class="badge" id="modelBadge">就绪</span>
</header>

<div class="ad-slot" id="adTop"><div class="ad-placeholder">广告位 · 顶部<br>AD_ENABLED=true 后显示</div></div>

<div id="status"></div>
<div class="progress-wrap" id="progressContainer">
  <div class="progress-bar"><div class="progress-inner" id="progressInner"></div></div>
  <div class="progress-text" id="progressText">0%</div>
</div>

<div class="card">
  <input type="file" id="uploadAlbum" accept="image/*" style="display:none">
  <input type="file" id="uploadCamera" accept="image/*" capture="environment" style="display:none">
  <div class="row">
    <button class="btn btn-primary" onclick="document.getElementById('uploadAlbum').click()">选择照片</button>
    <button class="btn btn-pink" onclick="document.getElementById('uploadCamera').click()">拍照</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn btn-warn" id="processBtn" onclick="processCurrent(false)" disabled>一键抠图</button>
    <button class="btn btn-accent" id="refineBtn" onclick="toggleRefine()" disabled>手动精修</button>
  </div>
  <div class="tip">纯色背景会自动走「快速抠图」，几秒完成；复杂背景走 AI 抠图（首次需联网下载模型，约几十秒）。</div>
</div>

<div class="card">
  <div class="meta" id="sizeInfo">1寸 · 295×413</div>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="brushCursor"></div>
    <div class="canvas-lock" id="canvasLock">构图已锁定</div>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn btn-ghost" id="editPoseBtn" onclick="toggleEditPose()">调整构图</button>
    <button class="btn btn-ghost" onclick="resetCrop()">复位</button>
  </div>
</div>

<div class="ad-slot" id="adAfterProcess"><div class="ad-placeholder">广告位 · 抠图后</div></div>

<div class="card" id="refinePanel">
  <div class="meta">精修 · 擦除 / 恢复 / 去色边</div>
  <div class="seg" style="margin-top:8px">
    <button class="btn btn-danger active" id="toolErase" onclick="setRefineTool('erase')">擦除</button>
    <button class="btn" id="toolRestore" onclick="setRefineTool('restore')">恢复</button>
    <button class="btn" id="toolDespill" onclick="setRefineTool('despill')">去色边</button>
  </div>
  <div class="slider-row">
    <label>笔刷</label>
    <input type="range" id="brushSize" min="2" max="120" value="16" step="1">
    <span id="brushValue">16</span>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn btn-ghost" id="undoBtn" onclick="undoRefine()" disabled>↶ 上一步</button>
    <button class="btn btn-ghost" id="redoBtn" onclick="redoRefine()" disabled>下一步 ↷</button>
  </div>
  <div class="meta" style="font-size:11px">白圈是落笔位置：鼠标下精确对齐，手指下略偏左上不被遮挡；靠近边缘自动收拢</div>
  <button class="btn btn-primary btn-block" onclick="toggleRefine()">完成精修</button>
</div>

<div class="card" id="normalPanel">
  <div class="row" style="margin-bottom:8px">
    <select id="sizeSelect" onchange="changeSize()">
      <option value="1c">1寸 25×35mm</option>
      <option value="2c">2寸 35×49mm</option>
      <option value="x2c">小2寸 35×45mm</option>
      <option value="d1c">大1寸 33×48mm</option>
      <option value="passport">护照</option>
      <option value="visa">签证</option>
    </select>
  </div>
  <div class="row" style="margin-bottom:8px">
    <select id="paperSelect" onchange="updatePaperInfo()">
      <option value="a4">A4 210×297mm</option>
      <option value="5c">5寸 89×127mm</option>
      <option value="6c">6寸 102×152mm</option>
      <option value="7c">7寸 127×178mm</option>
      <option value="a5">A5 148×210mm</option>
    </select>
  </div>
  <div class="meta" id="paperInfo">预计可排 8 张</div>

  <div class="swatches" id="swatches"></div>

  <div class="color-panel">
    <div class="rgb-row"><label>R</label><input type="range" id="rgbR" min="0" max="255" value="255"><span class="val" id="rgbRv">255</span></div>
    <div class="rgb-row"><label>G</label><input type="range" id="rgbG" min="0" max="255" value="255"><span class="val" id="rgbGv">255</span></div>
    <div class="rgb-row"><label>B</label><input type="range" id="rgbB" min="0" max="255" value="255"><span class="val" id="rgbBv">255</span></div>
    <div class="color-tools">
      <span class="hex" id="hexText">#ffffff</span>
      <button class="btn btn-ghost" id="eyedropperBtn" onclick="pickFromScreen()">吸管取色</button>
      <button class="btn btn-ghost" onclick="document.getElementById('customBg').click()">调色板</button>
      <input type="color" id="customBg" value="#ffffff" style="display:none" onchange="setBg(this.value)">
    </div>
  </div>

  <div class="slider-row">
    <label>美颜</label>
    <input type="range" id="beautyLevel" min="0" max="100" value="0">
    <span id="beautyValue">0</span>
  </div>
</div>

<div class="ad-slot" id="adBeforeDownload"><div class="ad-placeholder">广告位 · 下载前</div></div>

<div class="bottom">
  <div class="card" style="margin-bottom:0">
    <button class="btn btn-primary btn-block" onclick="downloadCurrent()">下载证件照</button>
    <button class="btn btn-block" onclick="generatePrintSheet()">按相纸排版下载</button>
    <div id="donatePanel">
      <div class="donate-title">下载成功</div>
      <div class="donate-desc">本工具免费使用。若帮到你，欢迎自愿打赏支持</div>
      <div class="qr-row">
        <div class="qr-item">
          <img id="qrWechat" alt="微信" style="display:none">
          <div class="qr-label" id="qrWechatLabel">微信（未配置）</div>
        </div>
        <div class="qr-item">
          <img id="qrAlipay" alt="支付宝" style="display:none">
          <div class="qr-label" id="qrAlipayLabel">支付宝（未配置）</div>
        </div>
      </div>
      <button type="button" class="donate-close" onclick="hideDonate()">关闭</button>
    </div>
  </div>
</div>

<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

/* ===== 只需改这里 ===== */
const AD_ENABLED = false;
const DONATE_QR = { wechat: "", alipay: "" };
const BG_COLORS = ["#ffffff", "#04b5f0", "#218ad7", "#ed0c0b", "#950e11", "#6a9cbe", "#f2f2f2"];
/* ===================== */

const MODEL = "isnet_quint8";
const PUBLIC_PATH = "https://staticimgly.com/@imgly/background-removal-data/1.7.0/dist/";
const PREVIEW_SIDE = 1400;
const AI_SIDES = [1024, 768, 640];
const TOUCH_OFFSET = 26;      // 触屏时焦点向左上偏移的屏幕像素
const MAX_HISTORY_BYTES = 60 * 1024 * 1024;

let currentFile = null, cleanCutout = null, workCanvas = null, workCtx = null, sourceCanvas = null;
let objectUrls = [];
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const wrap = document.getElementById("canvas-wrap");
const brushCursor = document.getElementById("brushCursor");
const sizeSelect = document.getElementById("sizeSelect");
const paperSelect = document.getElementById("paperSelect");
const sizeInfo = document.getElementById("sizeInfo");
const paperInfo = document.getElementById("paperInfo");
const statusEl = document.getElementById("status");
const processBtn = document.getElementById("processBtn");
const refineBtn = document.getElementById("refineBtn");
const beautyLevel = document.getElementById("beautyLevel");
const beautyValue = document.getElementById("beautyValue");
const progressContainer = document.getElementById("progressContainer");
const progressInner = document.getElementById("progressInner");
const progressText = document.getElementById("progressText");
const refinePanel = document.getElementById("refinePanel");
const normalPanel = document.getElementById("normalPanel");
const brushSize = document.getElementById("brushSize");
const brushValue = document.getElementById("brushValue");
const editPoseBtn = document.getElementById("editPoseBtn");
const canvasLock = document.getElementById("canvasLock");
const modelBadge = document.getElementById("modelBadge");
const donatePanel = document.getElementById("donatePanel");
const undoBtn = document.getElementById("undoBtn");
const redoBtn = document.getElementById("redoBtn");

const sizes = {
  "1c": { w: 295, h: 413, name: "1寸", mmW: 25, mmH: 35 },
  "2c": { w: 413, h: 579, name: "2寸", mmW: 35, mmH: 49 },
  "x2c": { w: 413, h: 531, name: "小2寸", mmW: 35, mmH: 45 },
  "d1c": { w: 390, h: 567, name: "大1寸", mmW: 33, mmH: 48 },
  "passport": { w: 390, h: 567, name: "护照", mmW: 33, mmH: 48 },
  "visa": { w: 413, h: 531, name: "签证", mmW: 35, mmH: 45 }
};
const papers = {
  "a4": { w: 210, h: 297, name: "A4" },
  "5c": { w: 89, h: 127, name: "5寸" },
  "6c": { w: 102, h: 152, name: "6寸" },
  "7c": { w: 127, h: 178, name: "7寸" },
  "a5": { w: 148, h: 210, name: "A5" }
};

let currentImg = null, bgColor = "#ffffff", crop = { x: 0, y: 0, scale: 1 };
let isDragging = false, lastTouch = null, lastDist = 0, currentSize = sizes["1c"];
let isProcessing = false, refineMode = false, refineTool = "erase", isPainting = false, editPose = false;
let strokeActive = false;
let history = [], hIdx = -1;

/* ================= 通用 ================= */
function trackUrl(url) { objectUrls.push(url); return url; }
function clearUrls() { while (objectUrls.length) { try { URL.revokeObjectURL(objectUrls.pop()); } catch (_) {} } }
function showStatus(msg, type) { statusEl.innerHTML = msg; statusEl.className = type; }
function hideStatus() { statusEl.style.display = "none"; statusEl.className = ""; }
function showProgress(percent, text) {
  progressContainer.style.display = "block";
  progressInner.style.width = percent + "%";
  progressText.textContent = text || (percent + "%");
}
function hideProgress() { progressContainer.style.display = "none"; }
function modelConfig() {
  return { model: MODEL, device: "cpu", publicPath: PUBLIC_PATH, debug: false, proxyToWorker: false, rescale: true, fetchArgs: { mode: "cors", credentials: "omit" } };
}

/* ================= 广告 / 打赏 ================= */
function initAds() {
  ["adTop", "adBeforeDownload"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("on", AD_ENABLED);
  });
  const after = document.getElementById("adAfterProcess");
  if (after) after.classList.remove("on");
}
function showAdAfterProcess() {
  if (!AD_ENABLED) return;
  const el = document.getElementById("adAfterProcess");
  if (el) el.classList.add("on");
}
function setupDonateQr() {
  const wx = document.getElementById("qrWechat"), ali = document.getElementById("qrAlipay");
  if (DONATE_QR.wechat) { wx.src = DONATE_QR.wechat; wx.style.display = "block"; document.getElementById("qrWechatLabel").textContent = "微信赞赏"; }
  if (DONATE_QR.alipay) { ali.src = DONATE_QR.alipay; ali.style.display = "block"; document.getElementById("qrAlipayLabel").textContent = "支付宝"; }
}
function showDonate() {
  setupDonateQr();
  donatePanel.classList.add("show");
  try { donatePanel.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (_) {}
}
function hideDonate() { donatePanel.classList.remove("show"); }
window.hideDonate = hideDonate;

/* ================= 图片工具 ================= */
async function imageToPngFile(img, maxSide) {
  const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * ratio));
  const h = Math.max(1, Math.round(img.height * ratio));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const t = c.getContext("2d");
  t.imageSmoothingEnabled = true; t.imageSmoothingQuality = "high";
  t.drawImage(img, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const out = new Image();
  out.src = trackUrl(URL.createObjectURL(blob));
  await new Promise((resolve, reject) => { out.onload = resolve; out.onerror = reject; });
  return { img: out, file: new File([blob], "photo.png", { type: "image/png" }) };
}
async function loadImageFromFile(file) {
  const img = new Image();
  img.src = trackUrl(URL.createObjectURL(file));
  await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
  return img;
}
async function blobToImage(blob) {
  const img = new Image();
  img.src = trackUrl(URL.createObjectURL(blob));
  await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
  return img;
}
function canvasFromImage(img) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  c.getContext("2d", { willReadFrequently: true }).drawImage(img, 0, 0);
  return c;
}
function canvasToImage(c) {
  return new Promise(resolve => { c.toBlob(async blob => resolve(await blobToImage(blob)), "image/png"); });
}
function cloneCanvas(src) {
  const c = document.createElement("canvas");
  c.width = src.width; c.height = src.height;
  c.getContext("2d").drawImage(src, 0, 0);
  return c;
}

/* ================= 蒙版算法 ================= */
function blurAlpha(alpha, w, h, passes = 1) {
  let src = alpha, dst = new Float32Array(w * h);
  for (let p = 0; p < passes; p++) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let sum = 0, cnt = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy; if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx; if (xx < 0 || xx >= w) continue;
          sum += src[yy * w + xx]; cnt++;
        }
      }

function chromaKeyCutout(img, threshold = 42) {
  const c = canvasFromImage(img);

async function applyBeauty(img, level) {
  if (level <= 3 || !img) return img;
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const t = c.getContext("2d");
  t.drawImage(img, 0, 0);
  const s = level / 100;
  t.filter = `blur(${1.6 + s * 3.2}px)`;
  t.globalAlpha = 0.4 + s * 0.42;
  t.drawImage(img, 0, 0);
  t.filter = "none"; t.globalAlpha = 1;
  const imageData = t.getImageData(0, 0, c.width, c.height);
  const data = imageData.data, bright = 8 + s * 26;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i+3] < 10) continue;
    data[i] = Math.min(255, data[i]*0.94+bright);
    data[i+1] = Math.min(255, data[i+1]*0.94+bright);
    data[i+2] = Math.min(255, data[i+2]*0.94+bright*0.9);
  }
  t.putImageData(imageData, 0, 0);
  return blobToImage(await new Promise(r => c.toBlob(r, "image/png")));
}

}

/* ---- 历史：每一步涂抹都可上一步 / 下一步 ---- */
function maxHistorySteps() {
  if (!workCanvas) return 5;
  const per = workCanvas.width * workCanvas.height * 4;
  return Math.max(3, Math.min(24, Math.floor(MAX_HISTORY_BYTES / Math.max(per, 1))));
}
function resetHistory() {
  history = []; hIdx = -1;
  if (workCanvas) { history.push(cloneCanvas(workCanvas)); hIdx = 0; }
  updateHistoryButtons();
}
function commitHistory() {
  if (!workCanvas) return;
  if (hIdx < history.length - 1) history = history.slice(0, hIdx + 1);
  history.push(cloneCanvas(workCanvas));
  hIdx = history.length - 1;
  const max = maxHistorySteps();
  while (history.length > max) { history.shift(); hIdx--; }
  updateHistoryButtons();
}
function restoreHistory(i) {
  const snap = history[i];
  if (!snap || !workCanvas) return;
  workCtx.save();
  workCtx.setTransform(1, 0, 0, 1, 0, 0);
  workCtx.globalCompositeOperation = "source-over";
  workCtx.clearRect(0, 0, workCanvas.width, workCanvas.height);
  workCtx.drawImage(snap, 0, 0);
  workCtx.restore();
  hIdx = i;
  updateHistoryButtons();
  draw();
}
function undoRefine() {
  if (hIdx <= 0) return;
  restoreHistory(hIdx - 1);
}
function redoRefine() {
  if (hIdx >= history.length - 1) return;
  restoreHistory(hIdx + 1);
}
function updateHistoryButtons() {
  undoBtn.disabled = !(hIdx > 0);
  redoBtn.disabled = !(hIdx < history.length - 1);
}

window.redoRefine = redoRefine;

/* ---- 坐标换算：触屏向左上偏移，边缘自适应 ---- */
function canvasPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width * currentSize.w,
    y: (clientY - rect.top) / rect.height * currentSize.h
  };
}
function paintPoint(clientX, clientY, isTouch) {
  const pt = canvasPoint(clientX, clientY);
  const rect = canvas.getBoundingClientRect();
  const k = currentSize.w / rect.width;
  const base = isTouch ? TOUCH_OFFSET * k : 0;
  if (!base) return pt;
  const edgeDist = Math.min(pt.x, pt.y, currentSize.w - pt.x, currentSize.h - pt.y);
  const ratio = Math.max(0, Math.min(1, edgeDist / (base * 0.35)));
  const off = base * ratio;
  return {
    x: Math.max(0, Math.min(currentSize.w, pt.x - off)),
    y: Math.max(0, Math.min(currentSize.h, pt.y - off))
  };
}
function workPoint(canvasPt) {
  return { x: (canvasPt.x - crop.x) / crop.scale, y: (canvasPt.y - crop.y) / crop.scale };
}

/* ---- 焦点环 ---- */
function showCursor(canvasPt) {
  if (!refineMode) return;
  const rect = canvas.getBoundingClientRect();
  const k = rect.width / currentSize.w;
  const r = Math.max(3, (+brushSize.value) * 0.9) * k;
  const wrapRect = wrap.getBoundingClientRect();
  const cx = rect.left - wrapRect.left + canvasPt.x * k;
  const cy = rect.top - wrapRect.top + canvasPt.y * k;
  brushCursor.style.display = "block";
  brushCursor.style.width = (r * 2) + "px";
  brushCursor.style.height = (r * 2) + "px";
  brushCursor.style.left = (cx - r) + "px";
  brushCursor.style.top = (cy - r) + "px";
}
function hideCursor() { brushCursor.style.display = "none"; }

/* ---- 涂抹 ---- */
function paintAt(canvasPt) {
  if (!workCtx || !refineMode) return;
  const { x, y } = workPoint(canvasPt);
  const softR = Math.max(1.5, (+brushSize.value) / crop.scale * 0.9);
  if (refineTool === "erase") {
    const grad = workCtx.createRadialGradient(x, y, 0, x, y, softR);
    grad.addColorStop(0, "rgba(0,0,0,1)"); grad.addColorStop(0.6, "rgba(0,0,0,0.75)"); grad.addColorStop(1, "rgba(0,0,0,0)");
    workCtx.save(); workCtx.globalCompositeOperation = "destination-out";
    workCtx.fillStyle = grad; workCtx.beginPath(); workCtx.arc(x, y, softR, 0, Math.PI * 2); workCtx.fill(); workCtx.restore();
  } else if (refineTool === "restore") {
    const tmp = document.createElement("canvas");
    tmp.width = workCanvas.width; tmp.height = workCanvas.height;
    const tc = tmp.getContext("2d");
    tc.drawImage(sourceCanvas, 0, 0);
    tc.globalCompositeOperation = "destination-in";
    const grad = tc.createRadialGradient(x, y, 0, x, y, softR);
    grad.addColorStop(0, "rgba(0,0,0,1)"); grad.addColorStop(0.65, "rgba(0,0,0,0.8)"); grad.addColorStop(1, "rgba(0,0,0,0)");
    tc.fillStyle = grad; tc.beginPath(); tc.arc(x, y, softR, 0, Math.PI * 2); tc.fill();
    workCtx.drawImage(tmp, 0, 0);
  } else if (refineTool === "despill") {
    const x0 = Math.max(0, Math.floor(x - softR - 1)), y0 = Math.max(0, Math.floor(y - softR - 1));
    const x1 = Math.min(workCanvas.width, Math.ceil(x + softR + 1)), y1 = Math.min(workCanvas.height, Math.ceil(y + softR + 1));
    const bw = x1 - x0, bh = y1 - y0; if (bw <= 0 || bh <= 0) return;
    const imageData = workCtx.getImageData(x0, y0, bw, bh);
    const data = imageData.data;
    for (let j = 0; j < bh; j++) for (let i = 0; i < bw; i++) {
      const dist = Math.hypot(x0 + i - x, y0 + j - y); if (dist > softR) continue;
      const strength = 1 - dist / softR, idx = (j * bw + i) * 4;
      if (data[idx + 3] < 8) continue;
      let r0 = data[idx], g0 = data[idx+1], b0 = data[idx+2];
      if (b0 > r0 + 5 || b0 > g0 + 3) {
        const excess = Math.max(0, b0 - Math.max(r0, g0)) * strength * 1.2;
        b0 = Math.max(0, b0 - excess); r0 = Math.min(255, r0 + excess * 0.22); g0 = Math.min(255, g0 + excess * 0.15);
      }
      const gray = (r0 + g0 + b0) / 3, mix = 0.4 * strength;
      data[idx] = r0*(1-mix)+gray*mix; data[idx+1] = g0*(1-mix)+gray*mix; data[idx+2] = b0*(1-mix)+gray*mix;
    }
    workCtx.putImageData(imageData, x0, y0);
  }
  draw();
}

window.setBg = setBg;

function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
}
function applyRgb() {
  const r = +document.getElementById("rgbR").value;
  const g = +document.getElementById("rgbG").value;
  const b = +document.getElementById("rgbB").value;
  document.getElementById("rgbRv").textContent = r;
  document.getElementById("rgbGv").textContent = g;
  document.getElementById("rgbBv").textContent = b;
  setBg(rgbToHex(r, g, b));
}
["rgbR", "rgbG", "rgbB"].forEach(id => {
  document.getElementById(id).addEventListener("input", applyRgb);
});
async function pickFromScreen() {
  if (!window.EyeDropper) {
    alert("当前浏览器不支持吸管取色，请用「调色板」选色（Chrome / Edge 支持吸管）");
    return;
  }
  try {
    const res = await new EyeDropper().open();
    setBg(res.sRGBHex);
  } catch (_) { /* 用户取消 */ }
}
window.pickFromScreen = pickFromScreen;

brushSize.oninput = () => {
  brushValue.textContent = brushSize.value;
  if (brushCursor.style.display === "block") {
    const last = lastCursorPoint;
    if (last) showCursor(last);
  }
};

/* ================= 绘制 ================= */
function fitCanvasDisplay() {
  const maxW = Math.min(390, wrap.clientWidth || (window.innerWidth - 48));
  const scale = maxW / currentSize.w;
  canvas.style.width = Math.round(currentSize.w * scale) + "px";
  canvas.style.height = Math.round(currentSize.h * scale) + "px";
}
function activeSource() {
  if (refineMode && workCanvas) return workCanvas;
  if (currentImg) return currentImg;
  return workCanvas;
}
function resetCrop() {
  const src = activeSource();
  const imgW = (src && src.width) || 1, imgH = (src && src.height) || 1;
  const scale = Math.max(currentSize.w / imgW, currentSize.h / imgH) * 1.02;
  crop.scale = scale;
  crop.x = (currentSize.w - imgW * scale) / 2;
  const fullCenterY = (currentSize.h - imgH * scale) / 2;
  crop.y = fullCenterY * 0.25; if (crop.y > 0) crop.y = 0;
  draw();
}
window.resetCrop = resetCrop;

function draw() {
  canvas.width = currentSize.w; canvas.height = currentSize.h;
  fitCanvasDisplay();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!currentImg && !workCanvas) {
    ctx.fillStyle = "#f5f8fc"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#9aa8bf"; ctx.font = "15px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("请选择照片", canvas.width/2, canvas.height/2); return;
  }
  ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const src = activeSource(); if (!src) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, canvas.width, canvas.height); ctx.clip();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, crop.x, crop.y, src.width * crop.scale, src.height * crop.scale);
  ctx.restore();
}

/* ================= 指针交互 ================= */
let lastCursorPoint = null;
function onPointerDown(clientX, clientY, isTouch) {
  if (refineMode) {
    strokeActive = true;
    isPainting = true; isDragging = false;
    const p = paintPoint(clientX, clientY, isTouch);
    lastCursorPoint = p; showCursor(p); paintAt(p);
    return;
  }
  if (!editPose) return;
  isDragging = true; lastTouch = { x: clientX, y: clientY };
}
function onPointerMove(clientX, clientY, isTouch, touchCount, touches) {
  if (refineMode) {
    const p = paintPoint(clientX, clientY, isTouch);
    lastCursorPoint = p; showCursor(p);
    if (isPainting) paintAt(p);
    return;
  }
  if (!editPose) return;
  if (isTouch && touchCount === 2 && touches) {
    const dist = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    if (lastDist) crop.scale *= dist / lastDist;
    lastDist = dist; draw(); return;
  }
  if (isDragging && lastTouch) {
    const rect = canvas.getBoundingClientRect();
    crop.x += (clientX - lastTouch.x) * (currentSize.w / rect.width);
    crop.y += (clientY - lastTouch.y) * (currentSize.h / rect.height);
    lastTouch = { x: clientX, y: clientY }; draw();
  }
}
function onPointerUp() {
  if (isPainting && refineMode && strokeActive) commitHistory();
  strokeActive = false;
  isDragging = false; isPainting = false; lastDist = 0;
}

wrap.addEventListener("touchstart", e => {
  if (!refineMode && !editPose) return;
  e.preventDefault();
  if (e.touches.length === 2) lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  onPointerDown(e.touches[0].clientX, e.touches[0].clientY, true);
}, { passive: false });
wrap.addEventListener("touchmove", e => {
  if (!refineMode && !editPose) return;
  e.preventDefault();
  onPointerMove(e.touches[0].clientX, e.touches[0].clientY, true, e.touches.length, e.touches);
}, { passive: false });
wrap.addEventListener("touchend", onPointerUp);
wrap.addEventListener("touchcancel", onPointerUp);

wrap.addEventListener("mousedown", e => {
  if (!refineMode && !editPose) return;
  e.preventDefault(); onPointerDown(e.clientX, e.clientY, false);
});
wrap.addEventListener("mousemove", e => {
  if (!refineMode || isPainting) return;   // 涂抹由 window 监听统一处理，避免重复落笔
  onPointerMove(e.clientX, e.clientY, false);
});
wrap.addEventListener("mouseleave", () => { if (!isPainting) hideCursor(); });
window.addEventListener("mousemove", e => { if (isPainting || isDragging) onPointerMove(e.clientX, e.clientY, false); });
window.addEventListener("mouseup", onPointerUp);

/* 键盘快捷键：精修时 Ctrl+Z / Ctrl+Shift+Z */
window.addEventListener("keydown", e => {
  if (!refineMode) return;
  const meta = e.ctrlKey || e.metaKey;
  if (!meta) return;
  if (e.key.toLowerCase() === "z") {
    e.preventDefault();
    if (e.shiftKey) redoRefine(); else undoRefine();
  } else if (e.key.toLowerCase() === "y") {
    e.preventDefault(); redoRefine();
  }
});

/* ================= 下载 / 排版 ================= */
function downloadCurrent() {
  if (!currentImg && !workCanvas) return alert("请先处理照片");
  draw();
  const a = document.createElement("a");
  a.download = `证件照_${sizeSelect.value}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
  showStatus("证件照已开始下载", "success");
  showDonate();
  setTimeout(hideStatus, 1500);
}
window.downloadCurrent = downloadCurrent;

function generatePrintSheet() {
  if (!currentImg && !workCanvas) return alert("请先处理照片");
  draw();
  const paper = papers[paperSelect.value], photo = currentSize;
  const gapMm = 3, marginMm = 5, dpi = 300, mmToPx = dpi / 25.4;
  const paperW = Math.round(paper.w * mmToPx), paperH = Math.round(paper.h * mmToPx);
  const photoW = photo.w, photoH = photo.h;
  const gap = Math.round(gapMm * mmToPx), margin = Math.round(marginMm * mmToPx);
  const cols = Math.floor((paperW - margin*2 + gap) / (photoW + gap));
  const rows = Math.floor((paperH - margin*2 + gap) / (photoH + gap));
  const total = Math.max(1, cols * rows);
  const sheet = document.createElement("canvas");
  sheet.width = paperW; sheet.height = paperH;
  const s = sheet.getContext("2d");
  s.fillStyle = "#ffffff"; s.fillRect(0, 0, paperW, paperH);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    s.drawImage(canvas, margin + c*(photoW+gap), margin + r*(photoH+gap), photoW, photoH);
  const a = document.createElement("a");
  a.download = `证件照_${paper.name}_${total}张.png`;
  a.href = sheet.toDataURL("image/png");
  a.click();
  showStatus(`已生成 ${paper.name} · ${total} 张`, "success");
  showDonate();
  setTimeout(hideStatus, 1500);
}
window.generatePrintSheet = generatePrintSheet;

/* ================= 初始化 ================= */
let beautyTimer = null;
beautyLevel.oninput = () => {
  beautyValue.textContent = beautyLevel.value;
  clearTimeout(beautyTimer);
  beautyTimer = setTimeout(() => applyBeautyRealtime(+beautyLevel.value), 40);
};

initAds();
buildSwatches();
syncColorInputs(bgColor);
changeSize();
updatePaperInfo();
draw();
</script>
